name: Update CS2 Files

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * 1-5'
    - cron: '0 */2 * * 0,6'

permissions:
  contents: write

concurrency:
  group: update-cs2-files
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run extractor
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Extractor attempt ${attempt}/3"
            if go run ./cmd/extractor/main.go; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f static
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update generated CS2 files"
          git push
